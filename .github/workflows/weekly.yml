name: Weekly

# Checks that do not need to run on every push: new advisories appear without
# any code change, and the stress tests take a few minutes.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      # Plain cargo audit fails on a vulnerability and only prints unsound or
      # unmaintained warnings. The audit-check action tried to open an issue
      # for those on scheduled runs, which needs a write token this job does
      # not get.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  stress:
    name: Slow stress tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # Hand-run tests are skipped: live_relay needs a public relay, and every
      # test named manual_* needs a local Tor or only prints a benchmark.
      # Name a new hand-run test manual_* so this list does not need editing.
      - run: cargo test --locked -- --ignored --skip live_relay --skip manual_
