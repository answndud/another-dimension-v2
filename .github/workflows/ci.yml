name: CI

# Fast checks on every code change. Slow stress tests and dependency advisories
# run on a schedule in weekly.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, clippy, tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The Rust toolchain is pinned so a new compiler or clippy release cannot
      # break CI without a deliberate upgrade.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: node --check web/app.js
      - run: node --check web/reprotect-work.js
      - run: node --test web/reprotect-ui.test.cjs
