[package]
name = "another-dimension-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }
